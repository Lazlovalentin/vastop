[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vastai-operator"
version = "0.3.9"
description = "Kubernetes operator for Vast.ai GPU instances built with Kopf"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Valenryn Andreishyn", email = "valentinandreishyn0@gmail.com" }]
dependencies = [
    "kopf>=1.45,<2.0",
    "kubernetes>=37.0",
    "vastai>=1.11",
    "pydantic>=2.14",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "pytest-mock>=3.17",
    "ruff>=0.17",
    "mypy>=2.4",
    "respx>=0.23",
]
# Fallback for clusters still on the deprecated `vastai-sdk` package; the
# wrapper imports `vastai` first and degrades to `vastai_sdk` only if absent
# (see vast_client.py). Declared here so the optional import is not flagged
# as undeclared.
legacy = [
    "vastai-sdk",
]

[project.scripts]
vastai-operator = "vastai_operator.__main__:main"

[tool.uv]
# vastai 1.11.0 hard-pins cryptography==49.0.0 and pillow==12.2.0, both carrying
# fixable HIGH/CRITICAL CVEs (cryptography CVE-2026-69247 fixed in 50.0.0;
# pillow CVE-2026-112393 et al. fixed in 13.0.0). Override the upstream pins.
# The operator only uses the vastai REST client, never its image (pillow) code
# path. Drop these once vastai relaxes its pins.
override-dependencies = ["cryptography>=50.0.0", "pillow>=13.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/vastai_operator"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
